name: Build PDF and DOCX

on:
  push:
    branches: [main]
    paths:
      - 'cv/**'
      - '.githooks/**'
      - '.github/**'
  pull_request:
    paths:
      - 'cv/**'
      - '.githooks/**'
      - '.github/**'

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - uses: actions/cache@v5
        with:
          path: |
            cv/.devenv
            ~/.cache/nix
          key: ${{ runner.os }}-devenv-v1-${{ hashFiles('cv/devenv.lock') }}
      - name: Build devenv shell (cached)
        working-directory: ./cv
        run: |
          nix profile install nixpkgs#devenv
          devenv shell bash -e -c 'echo "devenv cached"'
      - name: Lint, format check, and test
        working-directory: ./cv
        run: devenv shell bash -e -c 'just validate && just test'

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          git log origin/main..HEAD --format="%s" --no-merges | while IFS= read -r msg; do
            echo "$msg" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: ' || {
              echo "::error::Invalid commit message format: $msg"
              exit 1
            }
            len=${#msg}
            if [ "$len" -gt 72 ]; then
              echo "::error::Commit title over 72 chars ($len): $msg"
              exit 1
            fi
          done

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - uses: actions/cache@v5
        with:
          path: |
            cv/.devenv
            ~/.cache/nix
          key: ${{ runner.os }}-devenv-v1-${{ hashFiles('cv/devenv.lock') }}

      - name: Build devenv shell (cached)
        working-directory: ./cv
        run: |
          nix profile install nixpkgs#devenv
          devenv shell bash -e -c 'echo "devenv cached"'

      - name: Generate PDF and DOCX
        working-directory: ./cv
        run: devenv shell bash -e -c 'just build'

      - name: Generate date tag
        id: date
        run: echo "short=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT" && echo "long=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            LOG=$(git log "$LAST_TAG"..HEAD --oneline --no-merges 2>/dev/null || true)
          else
            LOG=$(git log --oneline --no-merges -10 2>/dev/null || true)
          fi
          {
            echo "body<<EOF"
            echo "Auto-built from commit ${{ github.sha }}"
            echo ""
            echo "## Changes"
            echo ""
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: cv-${{ steps.date.outputs.short }}-${{ github.run_number }}
          name: "CV build #${{ github.run_number }} - ${{ steps.date.outputs.long }}"
          body: ${{ steps.changelog.outputs.body }}
          files: |
            cv/resources/cv.md
            cv/dist/[REDACTED]_[REDACTED]_resume.pdf
            cv/dist/[REDACTED]_[REDACTED]_resume_public.pdf
            cv/dist/[REDACTED]_[REDACTED]_resume.docx
            cv/dist/[REDACTED]_[REDACTED]_resume.html
          target_commitish: ${{ github.sha }}
