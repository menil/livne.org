name: Build PDF and DOCX

on:
  push:
    branches: [main]
    paths:
      - 'cv/**'
      - '.githooks/**'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Run lint and format checks
        working-directory: ./cv
        run: |
          nix profile install nixpkgs#devenv
          devenv shell bash -e -c 'just validate'

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          git log origin/main..HEAD --format="%s" --no-merges | while IFS= read -r msg; do
            echo "$msg" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: ' || {
              echo "::error::Invalid commit message format: $msg"
              exit 1
            }
            len=${#msg}
            if [ "$len" -gt 72 ]; then
              echo "::error::Commit title over 72 chars ($len): $msg"
              exit 1
            fi
          done

      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v14
        with:
          name: devenv

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Generate PDF and DOCX
        working-directory: ./cv
        run: devenv shell bash -e -c './build_pdf.py cv.md && ./build_docx.py cv.md'

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: Resume build ${{ github.run_number }}
          body: Auto-built from commit ${{ github.sha }}
          files: |
            cv/cv.md
            cv/cv.pdf
            cv/cv.docx
          target_commitish: ${{ github.sha }}
