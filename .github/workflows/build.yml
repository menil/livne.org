name: Build PDF and DOCX

on:
  push:
    branches: [main]
    paths:
      - 'cv/**'
      - 'html/**'
      - '.githooks/**'
      - '.github/**'
  pull_request:
    paths:
      - 'cv/**'
      - 'html/**'
      - '.githooks/**'
      - '.github/**'

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - uses: actions/cache@v6
        with:
          path: cv/.devenv
          key: ${{ runner.os }}-devenv-v1-${{ hashFiles('cv/devenv.lock') }}
      - name: Build devenv shell (cached)
        working-directory: ./cv
        run: |
          nix profile install nixpkgs#devenv
          devenv shell bash -e -c 'echo "devenv cached"'
      - name: Lint, format check, and test
        working-directory: ./cv
        run: devenv shell bash -e -c 'just validate && just test'

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          git log origin/main..HEAD --format="%s" --no-merges | while IFS= read -r msg; do
            echo "$msg" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?!?: ' || {
              echo "::error::Invalid commit message format: $msg"
              exit 1
            }
            len=${#msg}
            if [ "$len" -gt 72 ]; then
              echo "::error::Commit title over 72 chars ($len): $msg"
              exit 1
            fi
          done

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - uses: actions/cache@v6
        with:
          path: cv/.devenv
          key: ${{ runner.os }}-devenv-v1-${{ hashFiles('cv/devenv.lock') }}

      - name: Build devenv shell (cached)
        working-directory: ./cv
        run: |
          nix profile install nixpkgs#devenv
          devenv shell bash -e -c 'echo "devenv cached"'

      - name: Generate PDF and DOCX
        working-directory: ./cv
        run: devenv shell bash -e -c 'just build'
        env:
          RESUME_NAME: ${{ secrets.RESUME_NAME }}
          RESUME_EMAIL: ${{ secrets.RESUME_EMAIL }}
          RESUME_PHONE: ${{ secrets.RESUME_PHONE }}
          RESUME_LINKEDIN: ${{ secrets.RESUME_LINKEDIN }}

      - name: Install Wrangler globally
        run: npm install -g wrangler

      - name: Create Cloudflare Pages project (if new)
        continue-on-error: true
        run: |
          wrangler pages project create livne-org --production-branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Pages
        run: |
          mkdir -p deploy
          shopt -s nullglob
          files=(cv/dist/*_resume.html)
          [ ${#files[@]} -eq 1 ] || { echo "Expected 1 HTML resume, found ${#files[@]}"; exit 1; }
          HTML_FILE="${files[0]}"
          files=(cv/dist/*_resume_public.pdf)
          [ ${#files[@]} -eq 1 ] || { echo "Expected 1 public PDF, found ${#files[@]}"; exit 1; }
          PUBLIC_PDF="${files[0]}"
          cp "$HTML_FILE" deploy/index.html
          PUBLIC_PDF_NAME="${PUBLIC_PDF##*/}"
          cp "$PUBLIC_PDF" deploy/"${PUBLIC_PDF_NAME/_public.pdf/.pdf}"
          cp static/404.html deploy/404.html
          cp static/favicon.svg deploy/favicon.svg
          wrangler pages deploy deploy \
            --project-name=livne-org \
            --branch="${{ github.head_ref || github.ref_name }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Generate date tag
        id: date
        run: echo "short=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT" && echo "long=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Upload Resumes to Cloudflare R2
        run: |
          shopt -s nullglob
          TAG="${{ steps.date.outputs.short }}-${{ github.run_number }}"
          for file in cv/dist/*_resume.* cv/dist/cv.md; do
            if [ -f "$file" ]; then
              filename="${file##*/}"
              # Upload versioned release subfolder and latest stable folder in parallel
              wrangler r2 object put "${{ secrets.CLOUDFLARE_R2_BUCKET }}/releases/$TAG/$filename" --file="$file" --remote &
              wrangler r2 object put "${{ secrets.CLOUDFLARE_R2_BUCKET }}/latest/$filename" --file="$file" --remote &
            fi
          done
          wait
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            LOG=$(git log "$LAST_TAG"..HEAD --oneline --no-merges 2>/dev/null || true)
          else
            LOG=$(git log --oneline --no-merges -10 2>/dev/null || true)
          fi
          {
            echo "body<<EOF"
            echo "Auto-built from commit ${{ github.sha }}"
            echo ""
            echo "## Changes"
            echo ""
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: cv-${{ steps.date.outputs.short }}-${{ github.run_number }}
          name: "CV build #${{ github.run_number }} - ${{ steps.date.outputs.long }}"
          body: ${{ steps.changelog.outputs.body }}
          files: |
            cv/dist/*_public.pdf
            cv/dist/*_resume.html
          target_commitish: ${{ github.sha }}
