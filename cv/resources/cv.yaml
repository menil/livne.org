work:
  - &whitepages
    name: Whitepages
    description: A high-volume data platform serving identity verification, people search, and real estate products at scale.
    position: Principal Software Engineer, Data & Web
    startDate: "2020"
    endDate: "2026"
    highlights:
      - Spearheaded generative AI integration into core engineering workflows by driving the adoption and establishing organizational standards for AI coding using Claude Code, accelerating overall developer velocity
      - Led the ground-up architecture and launch of a new consumer PropTech platform, engineering a highly scalable Typescript backend deployed on Cloudflare workers, integrating predictive machine learning models built in Python to generate automated, high-accuracy property valuations and rental income estimates at scale
      - Led the implementation of Landon, the Whitepages AI real estate assistant using AWS Bedrock, OpenSearch-backed RAG architecture and LLM integration
      - Conceptualized and drove the implementation of a centralized internal platform that accelerated the marketing department's experimentation velocity by 3x, working with VP-level stakeholders to directly unlock new company revenue streams, earning the CEO spot bonus for outstanding business impact
      - Partnered with the marketing department to drive conversion rate optimization (CRO) across user-facing properties, championing strict architectural standards for Core Web Vitals and technical SEO that directly improved organic reach and user acquisition
      - Fostered a culture of engineering excellence by mentoring cross-functional teams, leading technical training sessions, and establishing best practices for system architecture
  - <<: *whitepages
    position: Senior Software Engineer, Data
    startDate: "2019"
    endDate: "2020"
    highlights:
      - Rebuilt the core Whitepages data asset from scratch following a corporate spin-off, driving the implementation of a highly scalable data ingestion pipeline using Scala, Apache Spark, Databricks, Elasticsearch and Prefect to power the company's central search product
      - Spearheaded the search result optimization initiative across the organization
      - Engineered six-figure cost savings in the backend systems by optimizing Elasticsearch infrastructure, allowing the company to use in-house solutions and bypass an expensive managed-hosting migration

  - &fullcontact
    name: Contacts+ (acquired by FullContact)
    description: An industry-leading identity resolution platform and SaaS provider for professional contact management.
    position: Senior Backend Architect, FullContact
    startDate: "2018"
    endDate: "2019"
    highlights:
      - Directed the continued leadership of the Contacts+ backend and data asset development following the acquisition of Contacts+
  - <<: *fullcontact
    position: Senior Software Architect, Contacts+
    startDate: "2012"
    endDate: "2018"
    highlights:
      - "Employee #1 at an early-stage startup, driving the ground-up architecture of a highly scalable backend and proprietary data asset leveraging MongoDB and Redis, that grew to support hundreds of thousands of daily active users and culminated in a successful exit"
      - Architected and deployed a high-throughput Node.js API layer, alongside complex data aggregation pipelines designed to synthesize millions of records from various sources into a unified, clean data model
      - Engineered the native contacts management client app for Android, applying deep systems knowledge to optimize performance, memory usage and battery consumption across Dalvik and ART runtimes

