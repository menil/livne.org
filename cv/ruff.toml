line-length = 100
target-version = "py313"

[format]
quote-style = "double"

[lint]
select = ["D", "E", "F", "I", "W", "ANN", "C90", "N", "SIM", "PERF", "RUF", "UP", "ARG", "S"]

[lint.per-file-ignores]
"__init__.py" = ["ANN", "D"]
"tests/*" = ["ANN", "ARG", "D", "S"]
"src/pdf/*" = ["D"]
"src/docx/*" = ["D"]
"src/html/*" = ["D"]

[lint.mccabe]
max-complexity = 10
